<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">{{robots}}
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{share_image}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/img/site/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap">{{extra_css}}
<link rel="stylesheet" href="assets/css/site.css">
<script src="assets/js/site.js" defer></script>
</head>
<body data-page="{{page_id}}">
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap header-bar">
    <a class="site-title" href="{{home}}">{{site_title}}</a>
    <nav class="site-nav" aria-label="Main">{{nav}}{{cta}}</nav>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="mobile-menu">
      <span class="sr">Open Menu</span><i></i><i></i>
    </button>
  </div>
</header>
<div class="mobile-menu" id="mobile-menu" hidden>
  <nav class="wrap" aria-label="Main">{{nav}}{{cta}}</nav>
</div>
<main id="main">
{{content}}
</main>
<footer class="site-footer">
{{footer}}
</footer>
</body>
</html>
